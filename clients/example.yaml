# Пример конфигурации клиента. Все ставки и окна часов — ПРИМЕР: перед
# использованием заменить на тарифы региона, сетевой организации и плановые
# часы пиковой нагрузки СО ЕЭС для своей ценовой зоны.
name: "Завод, пример"
data_path: "data/raw/client_export.csv"
models_dir: "results/runs/<прогон>/models"
target_issue_hour: 10          # заявка на сутки вперёд подаётся в 10:00 накануне

export:
  timestamp_col: "Дата и время"
  wide: true                   # колонка на каждый прибор учёта
  unit: "kW"                   # в выгрузке средняя мощность за интервал
  stamp_at: "end"              # метка времени — конец интервала
  interval_minutes: 30
  sep: ";"
  decimal: ","
  encoding: "cp1251"
  exclude_columns: ["Итого"]

tariff:
  category: 6                  # 3–6
  energy_price: 3.20           # руб/кВт·ч
  gen_capacity_rate: 1050.0    # руб/кВт·мес
  net_capacity_rate: 1300.0    # руб/кВт·мес, категории 4 и 6
  net_energy_rate: 0.35        # руб/кВт·ч, категории 4 и 6
  net_single_rate: 2.60        # руб/кВт·ч, категории 3 и 5
  deviation_up_rate: 0.25      # руб/кВт·ч, категории 5 и 6
  deviation_down_rate: 0.15
  peak_windows:                # месяц: [начало, конец) часа
    1: [8, 21]
    2: [8, 21]
    3: [8, 21]
    4: [8, 21]
    5: [8, 21]
    6: [8, 21]
    7: [8, 21]
    8: [8, 21]
    9: [8, 21]
    10: [8, 21]
    11: [8, 21]
    12: [8, 21]

battery:
  capex_rub_per_kwh: 16000
